version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: analyze-stock
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:8080"
    environment:
      - PYTHONPATH=/app
      - WEB_PORT=${WEB_PORT:-8080}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    volumes:
      # Persist data across restarts
      - stock-data:/app/data
      - stock-cache:/app/cache
    networks:
      - stock-net

volumes:
  stock-data:
    driver: local
  stock-cache:
    driver: local

networks:
  stock-net:
    driver: bridge
