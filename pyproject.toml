[project]
name = "video_analysis"
version = "0.1.0"
description = "Video scraping, transcription, and LLM analysis framework"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "yt-dlp>=2024.0.0",
    "bilibili-api>=9.0.0",
]

[project.scripts]
analyze-video = "cli.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "litestar[testing]>=2.0",
    "mypy>=1.0",
]
douyin = ["dy-cli"]
