<div class="bg-white rounded-2xl shadow-md border border-gray-100 p-6" data-slide>
    {% if error %}
    <div class="text-center py-12">
        <div class="text-5xl mb-4 opacity-30">⚠️</div>
        <p class="text-red-500 text-lg font-medium">{{ error }}</p>
    </div>
    {% else %}
    <!-- Header with meta info + search -->
    <div class="flex items-start justify-between mb-4 pb-4 border-b border-gray-100 flex-wrap gap-3">
        <div>
            <h3 class="text-lg font-bold text-gray-800">{{ author }}</h3>
            <p class="text-xs text-gray-400 font-mono mt-0.5">{{ video_id }}</p>
        </div>
        <div class="flex items-center gap-3 flex-wrap">
            {% if play_count is defined and play_count %}
            <div class="text-center px-3 py-1.5 bg-orange-50 rounded-lg">
                <span class="text-sm font-bold text-orange-600">{{ play_count }}</span>
                <div class="text-[10px] text-orange-400">播放量</div>
            </div>
            {% endif %}
            <div class="text-center px-3 py-1.5 bg-gray-50 rounded-lg">
                <span class="text-sm font-bold text-gray-600">{{ total_lines }}</span>
                <div class="text-[10px] text-gray-400">行</div>
            </div>
            <div class="text-center px-3 py-1.5 bg-gray-50 rounded-lg">
                <span class="text-sm font-bold text-gray-600">{{ total_chars }}</span>
                <div class="text-[10px] text-gray-400">字符</div>
            </div>
            <div class="flex gap-1.5">
                <button onclick="copyText()" class="px-2.5 py-1.5 text-xs bg-gray-100 text-gray-500 rounded-lg hover:bg-blue-50 hover:text-blue-600 transition-all border border-gray-200">
                    📋 复制
                </button>
                <button onclick="document.getElementById('detail-search').classList.toggle('hidden'); document.getElementById('detail-search-input').focus();"
                        class="px-2.5 py-1.5 text-xs bg-gray-100 text-gray-500 rounded-lg hover:bg-blue-50 hover:text-blue-600 transition-all border border-gray-200">
                    🔍 搜索
                </button>
            </div>
        </div>
    </div>

    <!-- Detail search bar -->
    <div id="detail-search" class="hidden mb-4">
        <div class="relative">
            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm">🔍</span>
            <input type="text" id="detail-search-input"
                   class="w-full pl-9 pr-4 py-2 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-400 bg-gray-50"
                   placeholder="搜索内容... (回车高亮)">
        </div>
    </div>

    <!-- Transcript content -->
    <div id="detail-text" class="text-gray-700 whitespace-pre-wrap font-sans leading-relaxed"
         style="max-height: 70vh; overflow-y: auto; font-size: 0.875rem; line-height: 1.7;">
        {{ text }}
    </div>
    {% endif %}
</div>

<style>
.search-highlight {
    background: #fef08a;
    padding: 1px 2px;
    border-radius: 2px;
    font-weight: 600;
}
</style>

<script>
// Copy transcript text
function copyText() {
    const textEl = document.getElementById('detail-text');
    if (!textEl) return;
    navigator.clipboard.writeText(textEl.textContent).then(() => {
        showToast('已复制到剪贴板', 'success');
    }).catch(() => {
        // Fallback
        const ta = document.createElement('textarea');
        ta.value = textEl.textContent;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        showToast('已复制到剪贴板', 'success');
    });
}

// Search and highlight in detail view
document.addEventListener('DOMContentLoaded', function() {
    const input = document.getElementById('detail-search-input');
    if (!input) return;

    input.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            const query = this.value.trim();
            if (!query) return;
            highlightText(query);
        }
    });
});

function highlightText(query) {
    const textEl = document.getElementById('detail-text');
    if (!textEl || !query) return;

    // Remove existing highlights first
    const html = textEl.innerHTML;
    const temp = document.createElement('div');
    temp.innerHTML = html;
    const text = temp.textContent;

    // Simple text replace
    const regex = new RegExp(`(${query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
    const newHtml = html.replace(regex, '<span class="search-highlight">$1</span>');
    textEl.innerHTML = newHtml;

    // Scroll to first highlight
    const firstHighlight = textEl.querySelector('.search-highlight');
    if (firstHighlight) {
        firstHighlight.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
}

// Simple toast notification
function showToast(message, type) {
    const container = document.getElementById('toast-container');
    if (!container) {
        // Fallback: alert
        alert(message);
        return;
    }
    const toast = document.createElement('div');
    toast.className = 'toast toast-success';
    toast.innerHTML = '<span class="toast-icon">✓</span><span class="toast-body">' + message + '</span>';
    container.appendChild(toast);
    setTimeout(function() { if (toast.parentNode) toast.remove(); }, 3000);
}
</script>
