{% extends "base.html" %}
{% block content %}
<div class="max-w-lg mx-auto" data-slide>
    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-8 text-center">
        <div class="w-16 h-16 bg-gradient-to-br from-pink-400 to-pink-600 rounded-2xl flex items-center justify-center text-white text-2xl mx-auto mb-4 shadow-lg">
            B
        </div>
        <h2 class="text-2xl font-bold text-gray-800 mb-1">Bilibili 扫码登录</h2>
        <p class="text-sm text-gray-400 mb-6">登录后即可搜索 B站视频</p>

        <!-- Step 1: 显示二维码 -->
        <div id="qrcode-section" class="mb-6">
            <div class="inline-block p-4 bg-white rounded-xl border border-gray-200 shadow-sm">
                <div id="qrcode-image" class="w-48 h-48 mx-auto">
                    <img id="qrcode-img" src="" alt="二维码" class="w-full h-full object-contain">
                </div>
            </div>

            <div class="mt-5 space-y-3">
                <div class="flex items-start gap-3 text-left">
                    <span class="w-6 h-6 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center text-xs font-bold shrink-0">1</span>
                    <p class="text-sm text-gray-600">打开手机 Bilibili App</p>
                </div>
                <div class="flex items-start gap-3 text-left">
                    <span class="w-6 h-6 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center text-xs font-bold shrink-0">2</span>
                    <p class="text-sm text-gray-600">点击右上角 ··· → 扫一扫</p>
                </div>
                <div class="flex items-start gap-3 text-left">
                    <span class="w-6 h-6 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center text-xs font-bold shrink-0">3</span>
                    <p class="text-sm text-gray-600">扫描上方二维码</p>
                </div>
            </div>

            <!-- Status messages -->
            <div id="qrcode-status" class="mt-4 text-sm text-gray-500">
                <span class="inline-flex items-center gap-2">
                    <span class="w-2 h-2 bg-gray-400 rounded-full animate-pulse"></span>
                    等待扫码中...
                </span>
            </div>

            <!-- Timer -->
            <div id="qrcode-timer" class="mt-2 text-xs text-gray-400"></div>
        </div>

        <!-- Step 2: 登录成功 -->
        <div id="success-section" class="hidden mb-6">
            <div class="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center text-3xl mx-auto">
                ✅
            </div>
            <p class="text-lg font-semibold text-green-600 mt-3">登录成功！</p>
            <p class="text-sm text-gray-400 mt-1">Cookie 已保存，正在返回...</p>
        </div>

        <!-- Step 3: 登录失败 -->
        <div id="error-section" class="hidden mb-6">
            <div class="w-16 h-16 bg-red-100 rounded-full flex items-center justify-center text-3xl mx-auto">
                ❌
            </div>
            <p class="text-lg font-semibold text-red-600 mt-3" id="error-message">登录失败</p>
        </div>

        <!-- Action buttons -->
        <div class="flex items-center justify-center gap-3">
            <a href="/search" class="px-5 py-2.5 bg-gray-100 text-gray-600 rounded-lg hover:bg-gray-200 font-medium text-sm transition-all">
                ← 返回搜索
            </a>
            <button id="btn-refresh" class="hidden px-5 py-2.5 bg-gradient-to-r from-pink-500 to-pink-600 text-white rounded-lg hover:from-pink-600 hover:to-pink-700 font-medium text-sm transition-all shadow-sm">
                刷新二维码
            </button>
        </div>
    </div>

    <!-- Alternative: manual cookie -->
    <div class="mt-6 bg-white rounded-xl shadow-sm border border-gray-100 p-6">
        <h3 class="font-semibold text-gray-700 mb-3 text-sm">备选方案：手动粘贴 Cookie</h3>
        <form id="cookie-form" class="space-y-3">
            <textarea id="cookie-input" placeholder="在浏览器控制台输入: document.cookie"
                      class="w-full px-4 py-2.5 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-pink-500 bg-gray-50 text-sm font-mono"
                      rows="3"></textarea>
            <button type="submit" class="w-full px-4 py-2.5 bg-gradient-to-r from-blue-500 to-blue-600 text-white rounded-lg hover:from-blue-600 hover:to-blue-700 font-medium text-sm transition-all shadow-sm">
                保存 Cookie
            </button>
        </form>
        <div id="cookie-status" class="mt-2 text-sm text-center hidden"></div>
    </div>
</div>

<script>
let pollTimer = null;
let countDownTimer = null;
let qrcodeKey = '';
let expireSeconds = 120;
let startTime = Date.now();

// Generate QR code
async function generateQrcode() {
    try {
        const resp = await fetch('/api/bilibili/qrcode/generate');
        const data = await resp.json();
        
        if (data.status === 'ok') {
            qrcodeKey = data.qrcode_key;
            const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(data.url)}`;
            document.getElementById('qrcode-img').src = qrUrl;
            
            // Start polling
            startPolling();
            
            // Start countdown
            startTime = Date.now();
            expireSeconds = 120;
            document.getElementById('qrcode-status').innerHTML = `
                <span class="inline-flex items-center gap-2">
                    <span class="w-2 h-2 bg-gray-400 rounded-full animate-pulse"></span>
                    等待扫码中...
                </span>
            `;
            document.getElementById('btn-refresh').classList.add('hidden');
        }
    } catch (e) {
        console.error('Failed to generate QR code:', e);
    }
}

// Poll for login status
function startPolling() {
    if (pollTimer) clearInterval(pollTimer);
    
    pollTimer = setInterval(async () => {
        try {
            const resp = await fetch(`/api/bilibili/qrcode/poll?key=${qrcodeKey}`);
            const data = await resp.json();
            
            if (data.status === 'confirmed') {
                clearInterval(pollTimer);
                clearInterval(countDownTimer);
                handleSuccess();
            } else if (data.status === 'expired') {
                clearInterval(pollTimer);
                handleExpired();
            } else if (data.status === 'scanned') {
                document.getElementById('qrcode-status').innerHTML = `
                    <span class="inline-flex items-center gap-2 text-blue-500">
                        <span class="w-2 h-2 bg-blue-500 rounded-full animate-pulse"></span>
                        已扫描，等待确认...
                    </span>
                `;
            }
        } catch (e) {
            console.error('Poll error:', e);
        }
    }, 2000);
}

// Countdown timer
countDownTimer = setInterval(() => {
    const elapsed = Math.floor((Date.now() - startTime) / 1000);
    const remaining = Math.max(0, expireSeconds - elapsed);
    
    if (remaining <= 10) {
        document.getElementById('qrcode-timer').textContent = `二维码将在 ${remaining} 秒后过期`;
        document.getElementById('qrcode-timer').classList.add('text-red-400');
    } else {
        const mins = Math.floor(remaining / 60);
        const secs = remaining % 60;
        document.getElementById('qrcode-timer').textContent = `剩余时间: ${mins}:${secs.toString().padStart(2, '0')}`;
    }
}, 1000);

// Handle success
async function handleSuccess() {
    // Try to get cookies from server
    try {
        await fetch('/api/bilibili/confirm', { method: 'POST' });
    } catch (e) {
        console.error('Confirm error:', e);
    }
    
    document.getElementById('qrcode-section').classList.add('hidden');
    document.getElementById('success-section').classList.remove('hidden');
    
    setTimeout(() => {
        window.location.href = '/search';
    }, 2000);
}

// Handle expired
function handleExpired() {
    document.getElementById('qrcode-status').innerHTML = `
        <span class="text-red-500">二维码已过期</span>
    `;
    document.getElementById('btn-refresh').classList.remove('hidden');
    clearInterval(countDownTimer);
}

// Manual cookie save
document.getElementById('cookie-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const cookieStr = document.getElementById('cookie-input').value.trim();
    const statusEl = document.getElementById('cookie-status');
    
    if (!cookieStr) {
        statusEl.textContent = '请输入 Cookie';
        statusEl.className = 'mt-2 text-sm text-center text-red-500';
        statusEl.classList.remove('hidden');
        return;
    }
    
    try {
        const resp = await fetch('/api/bilibili/cookies', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ cookies: cookieStr })
        });
        const data = await resp.json();
        
        statusEl.textContent = data.message;
        statusEl.className = `mt-2 text-sm text-center ${data.status === 'success' ? 'text-green-500' : 'text-red-500'}`;
        statusEl.classList.remove('hidden');
        
        if (data.status === 'success') {
            setTimeout(() => {
                window.location.href = '/search';
            }, 1500);
        }
    } catch (err) {
        statusEl.textContent = '保存失败: ' + err.message;
        statusEl.className = 'mt-2 text-sm text-center text-red-500';
        statusEl.classList.remove('hidden');
    }
});

// Refresh QR code
document.getElementById('btn-refresh').addEventListener('click', () => {
    document.getElementById('error-section').classList.add('hidden');
    document.getElementById('qrcode-status').classList.remove('hidden');
    generateQrcode();
});

// Initial load
generateQrcode();
</script>
{% endblock %}
