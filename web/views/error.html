<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ code }} - 股票智能监控系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .bg-gradient-page {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            position: relative;
        }
        .bg-gradient-page::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at 50% 0%, rgba(59,130,246,0.08) 0%, transparent 60%);
            pointer-events: none;
        }
        .glow-number {
            text-shadow: 0 0 60px rgba(59, 130, 246, 0.3), 0 0 120px rgba(59, 130, 246, 0.1);
            animation: float 4s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-12px); }
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.5); }
        }
        @keyframes shootingStar {
            0% { transform: translateX(-100%) translateY(0); opacity: 1; }
            100% { transform: translateX(200%) translateY(40px); opacity: 0; }
        }
        .fade-up {
            animation: fadeUp 0.6s cubic-bezier(0.4,0,0.2,1) both;
        }
        .fade-up-d1 { animation-delay: 0.15s; }
        .fade-up-d2 { animation-delay: 0.3s; }
        .fade-up-d3 { animation-delay: 0.45s; }
        .particle {
            position: absolute;
            width: 3px; height: 3px;
            border-radius: 50%;
            background: rgba(96, 165, 250, 0.4);
            animation: twinkle 3s ease-in-out infinite;
        }
        .shooting-star {
            position: absolute;
            width: 80px; height: 1.5px;
            background: linear-gradient(90deg, transparent, rgba(96,165,250,0.6), transparent);
            animation: shootingStar 4s ease-in-out infinite;
            pointer-events: none;
        }
    </style>
</head>
<body class="bg-gradient-page min-h-screen flex items-center justify-center overflow-hidden">
    <!-- Stars -->
    <div class="particle" style="top:15%;left:12%;animation-delay:0s"></div>
    <div class="particle" style="top:25%;left:80%;animation-delay:0.8s;width:2px;height:2px"></div>
    <div class="particle" style="top:55%;left:22%;animation-delay:1.6s;width:4px;height:4px"></div>
    <div class="particle" style="top:70%;left:65%;animation-delay:2.4s;width:2px;height:2px"></div>
    <div class="particle" style="top:40%;left:45%;animation-delay:3.2s"></div>
    <div class="particle" style="top:10%;left:50%;animation-delay:0.5s;width:2px;height:2px"></div>
    <div class="particle" style="top:85%;left:35%;animation-delay:1.8s;width:3px;height:3px"></div>
    <div class="particle" style="top:45%;left:88%;animation-delay:2.8s"></div>

    <!-- Shooting star -->
    <div class="shooting-star" style="top:12%;left:10%;animation-delay:5s"></div>
    <div class="shooting-star" style="top:30%;left:60%;animation-delay:10s;width:60px"></div>

    <div class="text-center z-10 px-4">
        <div class="glow-number text-9xl font-extrabold" style="line-height:1">
            <span class="bg-gradient-to-br from-blue-400 via-blue-500 to-purple-600 bg-clip-text text-transparent">{{ code }}</span>
        </div>
        <div class="mt-8 space-y-2">
            <p class="text-2xl font-semibold text-gray-200 fade-up fade-up-d1">
                {% if code == 404 %}
                页面未找到
                {% elif code == 500 %}
                服务器内部错误
                {% else %}
                出错了
                {% endif %}
            </p>
            <p class="text-gray-400 text-sm fade-up fade-up-d2 max-w-md mx-auto">{{ message }}</p>
        </div>
        <div class="mt-10 flex items-center justify-center gap-4 fade-up fade-up-d3 flex-wrap">
            <a href="/"
               class="inline-flex items-center gap-2 px-6 py-3 bg-gradient-to-r from-blue-500 to-blue-600 text-white rounded-xl hover:from-blue-600 hover:to-blue-700 font-medium transition-all shadow-lg hover:shadow-blue-500/25 text-sm active:scale-95">
                <span>🏠</span>
                返回首页
            </a>
            {% if code == 500 %}
            <button onclick="location.reload()"
                    class="inline-flex items-center gap-2 px-6 py-3 bg-white/5 text-gray-300 rounded-xl hover:bg-white/10 hover:text-white font-medium transition-all text-sm border border-white/10 backdrop-blur-sm active:scale-95">
                <span>🔄</span>
                重试
            </button>
            {% endif %}
        </div>
        <p class="text-xs text-gray-600 mt-12 fade-up fade-up-d3 font-mono">{{ code }} · analyze-stock</p>
    </div>
</body>
</html>
